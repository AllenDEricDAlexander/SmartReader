name: Build v0.1.0 cross-platform assets

on:
  push:
    branches:
      - codex/release-v0.1.0-cross-platform

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: macos-intel
            runner: macos-15-intel
    env:
      CARGO_NET_RETRY: 5
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ea0d43833e0e5d85f96876cee7bccc052b548bec
          persist-credentials: false

      - name: Verify source and architecture
        run: |
          test "$(git rev-parse HEAD)" = ea0d43833e0e5d85f96876cee7bccc052b548bec
          case "${{ matrix.platform }}" in
            windows-x64) expected_host=x86_64-pc-windows-msvc ;;
            linux-x64) expected_host=x86_64-unknown-linux-gnu ;;
            macos-intel) expected_host=x86_64-apple-darwin ;;
          esac
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          rustup default 1.97.0
          rustc -vV
          rustc -vV | grep -Fx "host: $expected_host"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile

      - name: Prepare package icons
        if: matrix.platform != 'macos-intel'
        run: |
          bunx --no-install tauri icon src-tauri/icons/icon.png --output generated-icons
          cp generated-icons/icon.ico src-tauri/icons/icon.ico
          cp generated-icons/128x128.png src-tauri/icons/128x128.png

      - name: Build Windows installer
        if: matrix.platform == 'windows-x64'
        run: |
          bunx --no-install tauri build --ci --bundles nsis --config '{"bundle":{"icon":["icons/icon.ico","icons/icon.png"]}}' -- --locked
          python -c 'import struct; p="src-tauri/target/release/smartreader.exe"; b=open(p,"rb").read(); assert b[:2]==b"MZ"; o=struct.unpack_from("<I",b,60)[0]; assert b[o:o+4]==b"PE\0\0"; assert struct.unpack_from("<H",b,o+4)[0]==0x8664; print("Verified x86-64 PE application:",p)'
          mkdir -p release-assets
          installers=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          test "${#installers[@]}" -eq 1
          test -f "${installers[0]}"
          cp "${installers[0]}" release-assets/SmartReader_v0.1.0_windows_x64-setup.exe

      - name: Build Linux installers
        if: matrix.platform == 'linux-x64'
        run: |
          bunx --no-install tauri build --ci --bundles deb,rpm --config '{"bundle":{"icon":["icons/icon.png","icons/128x128.png"]}}' -- --locked
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          rpms=(src-tauri/target/release/bundle/rpm/*.rpm)
          test "${#debs[@]}" -eq 1 && test -f "${debs[0]}"
          test "${#rpms[@]}" -eq 1 && test -f "${rpms[0]}"
          test "$(dpkg-deb -f "${debs[0]}" Architecture)" = amd64
          test "$(dpkg-deb -f "${debs[0]}" Version)" = 0.1.0
          test "$(rpm -qp --qf '%{ARCH}' "${rpms[0]}")" = x86_64
          test "$(rpm -qp --qf '%{VERSION}' "${rpms[0]}")" = 0.1.0
          dpkg-deb -I "${debs[0]}"
          rpm -qpi "${rpms[0]}"
          file src-tauri/target/release/smartreader | grep 'x86-64'
          mkdir -p release-assets
          cp "${debs[0]}" release-assets/SmartReader_v0.1.0_linux_amd64.deb
          cp "${rpms[0]}" release-assets/SmartReader_v0.1.0_linux_x86_64.rpm

      - name: Build Intel Mac installer
        if: matrix.platform == 'macos-intel'
        run: |
          bunx --no-install tauri build --ci --no-sign --bundles app -- --locked
          mkdir -p mac-stage release-assets
          ditto src-tauri/target/release/bundle/macos/SmartReader.app mac-stage/SmartReader.app
          codesign --force --deep --sign - mac-stage/SmartReader.app
          codesign --verify --deep --strict --verbose=2 mac-stage/SmartReader.app
          test "$(lipo -archs mac-stage/SmartReader.app/Contents/MacOS/smartreader)" = x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' mac-stage/SmartReader.app/Contents/Info.plist)" = com.smartreader.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' mac-stage/SmartReader.app/Contents/Info.plist)" = 0.1.0
          ln -s /Applications mac-stage/Applications
          hdiutil create -volname 'SmartReader 0.1.0' -srcfolder mac-stage -format UDZO release-assets/SmartReader_v0.1.0_x86_64.dmg
          hdiutil verify release-assets/SmartReader_v0.1.0_x86_64.dmg

      - name: Test native file handling
        run: |
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml notes_export::tests
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml file_commands::tests

      - name: Record asset digests
        run: |
          cd release-assets
          python -c 'import hashlib,pathlib,sys; files=sorted(pathlib.Path(".").glob("SmartReader*")); assert files; pathlib.Path(sys.argv[1]).write_text("".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files), encoding="utf-8")' "SHA256SUMS.${{ matrix.platform }}"
          cat "SHA256SUMS.${{ matrix.platform }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smartreader-v0.1.0-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
