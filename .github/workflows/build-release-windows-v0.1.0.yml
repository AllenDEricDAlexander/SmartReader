name: Build v0.1.0 Windows asset

on:
  push:
    branches:
      - codex/release-v0.1.0-windows

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_NET_RETRY: 5
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ea0d43833e0e5d85f96876cee7bccc052b548bec
          persist-credentials: false

      - name: Verify source and toolchain
        run: |
          test "$(git rev-parse HEAD)" = ea0d43833e0e5d85f96876cee7bccc052b548bec
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          rustup default 1.97.0
          rustc -vV | grep -Fx 'host: x86_64-pc-windows-msvc'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate the Windows icon from the existing project icon
        run: |
          bunx --no-install tauri icon src-tauri/icons/icon.png --output generated-icons
          cp generated-icons/icon.ico src-tauri/icons/icon.ico

      - name: Build and check the installer
        run: |
          bunx --no-install tauri build --ci --bundles nsis --config '{"bundle":{"icon":["icons/icon.ico","icons/icon.png"]}}' -- --locked
          python -c 'import struct; p="src-tauri/target/release/smartreader.exe"; b=open(p,"rb").read(); assert b[:2]==b"MZ"; o=struct.unpack_from("<I",b,60)[0]; assert b[o:o+4]==b"PE\0\0"; assert struct.unpack_from("<H",b,o+4)[0]==0x8664; print("Verified x86-64 PE application:",p)'
          installers=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          test "${#installers[@]}" -eq 1 && test -f "${installers[0]}"
          mkdir -p release-assets
          cp "${installers[0]}" release-assets/SmartReader_v0.1.0_windows_x64-setup.exe

      - name: Adapt the test-only path assertion for Windows
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/file_commands.rs')
          source = path.read_bytes()
          old = b'assert!(paths[1].ends_with("nested/b.pdf"));'
          new = b'assert!(Path::new(&paths[1]).ends_with(Path::new("nested").join("b.pdf")));'
          assert source.count(old) == 1
          path.write_bytes(source.replace(old, new))
          PY
          git diff -- src-tauri/src/file_commands.rs

      - name: Test native file handling
        run: |
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib notes_export::tests
          mapfile -t test_binaries < <(find src-tauri/target/release/deps -maxdepth 1 -type f -name 'smartreader_lib-*.exe')
          test "${#test_binaries[@]}" -eq 1
          "${test_binaries[0]}" file_commands::tests

      - name: Record asset digest
        run: |
          cd release-assets
          python -c 'import hashlib,pathlib; p=pathlib.Path("SmartReader_v0.1.0_windows_x64-setup.exe"); pathlib.Path("SHA256SUMS.windows-x64").write_text(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n", encoding="utf-8")'
          cat SHA256SUMS.windows-x64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smartreader-v0.1.0-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
