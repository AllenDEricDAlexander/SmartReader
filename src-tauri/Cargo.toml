[package]
name = "smartreader"
version = "0.1.0"
description = "SmartReader desktop PDF reader"
authors = ["SmartReader"]
edition = "2021"

[lib]
name = "smartreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
# Wry gates macOS WebView background updates behind this feature.
tauri = { version = "2.11.2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1.0.6"
thiserror = "2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "macros"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["native-tls"] }
tokio = { version = "=1.52.3", features = ["rt", "sync"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSColor", "NSView", "NSWindow", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["CALayer", "CATransaction", "objc2-core-graphics"] }
