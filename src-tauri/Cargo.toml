[package]
name = "smartreader"
version = "0.1.0"
description = "SmartReader desktop shell"
authors = ["SmartReader"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "smartreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.39.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
lopdf = { version = "0.36", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSValue", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSColor"] }
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["PDFAnnotation", "PDFAnnotationUtilities", "PDFBorder", "PDFDocument", "PDFPage", "objc2-app-kit", "objc2-core-foundation", "objc2-core-graphics"] }
